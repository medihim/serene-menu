<style>
#serene-treatment-funnel{
  --serene-deep:#446A5B;
  --serene-green:#598865;
  --serene-soft-green:#8BA991;
  --serene-mist:#E5ECE4;
  --serene-beige:#DACEB8;
  --serene-ivory:#E3DAC8;
  --serene-ink:#2F2F2F;
  --serene-muted:#5A5A5A;
  --serene-line:rgba(68,106,91,.18);
  --serene-white:#FFFFFF;
  --serene-page:#FBFAF7;
  --serene-danger:#93584F;
  color:var(--serene-ink);
  font-family:"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  line-height:1.62;
  background:var(--serene-page);
}
#serene-treatment-funnel *{box-sizing:border-box}
#serene-treatment-funnel button,#serene-treatment-funnel a{font:inherit}
.stf-wrap{max-width:1160px;margin:0 auto;padding:30px 22px 84px}
.stf-stage{
  display:none;margin:0 0 18px;padding:11px 15px;
  border:1px solid rgba(147,88,79,.25);background:#fbf3f0;color:var(--serene-danger);
  border-radius:8px;font-size:12px;font-weight:600
}
.stf-stage.is-on{display:block}

/* SERENE editorial hero */
.stf-hero{
  position:relative;overflow:hidden;
  background:var(--serene-mist);
  border:1px solid rgba(68,106,91,.10);
  border-radius:4px;
  padding:66px 64px 58px;
  margin-bottom:22px;
}
.stf-hero:after{
  content:"SERENE";
  position:absolute;right:40px;bottom:-16px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(72px,11vw,150px);letter-spacing:.02em;
  color:rgba(68,106,91,.055);line-height:1;pointer-events:none;
}
.stf-kicker{
  position:relative;z-index:1;
  font-family:Georgia,"Times New Roman",serif;
  font-size:13px;letter-spacing:.18em;color:var(--serene-deep);font-weight:500;
}
.stf-hero h2{
  position:relative;z-index:1;max-width:720px;
  color:var(--serene-deep);
  font-size:clamp(31px,5vw,52px);line-height:1.25;letter-spacing:-.045em;
  margin:14px 0 18px;font-weight:600;
}
.stf-hero p{
  position:relative;z-index:1;max-width:700px;
  margin:0;color:var(--serene-muted);font-size:15px;line-height:1.85;
}
.stf-philosophy{
  position:relative;z-index:1;
  display:flex;gap:0;flex-wrap:wrap;margin-top:32px;max-width:760px;
  border-top:1px solid rgba(68,106,91,.20);
}
.stf-philosophy span{
  display:inline-flex;align-items:center;min-height:48px;
  padding:0 24px 0 0;margin-right:24px;
  font-size:12px;color:var(--serene-deep);font-weight:600;
}
.stf-philosophy span+span:before{
  content:"";width:1px;height:14px;background:rgba(68,106,91,.24);margin-right:24px;
}

/* Concern discovery */
.stf-discovery{
  padding:34px 6px 20px;
}
.stf-discovery .stf-eyebrow{
  font-size:11px;letter-spacing:.14em;color:var(--serene-green);font-weight:700;margin-bottom:7px
}
.stf-discovery h3{
  color:var(--serene-deep);font-size:24px;letter-spacing:-.035em;margin:0 0 5px;font-weight:600
}
.stf-discovery p{margin:0 0 17px;color:var(--serene-muted);font-size:13px}

.stf-chip-row,.stf-filter-row{
  display:flex;gap:9px;overflow:auto;padding:3px 0 10px;scrollbar-width:none
}
.stf-chip-row::-webkit-scrollbar,.stf-filter-row::-webkit-scrollbar{display:none}
.stf-chip,.stf-filter{
  flex:0 0 auto;border:1px solid var(--serene-line);
  background:rgba(255,255,255,.82);color:var(--serene-deep);
  border-radius:999px;padding:10px 16px;cursor:pointer;font-size:12px;font-weight:500;
  transition:.18s ease;
}
.stf-chip:hover,.stf-filter:hover{border-color:var(--serene-soft-green);background:var(--serene-mist)}
.stf-filter.is-active{
  background:var(--serene-deep);color:#fff;border-color:var(--serene-deep)
}
.stf-nav{
  position:sticky;top:0;z-index:5;
  background:rgba(251,250,247,.94);backdrop-filter:blur(12px);
  border-top:1px solid var(--serene-line);border-bottom:1px solid var(--serene-line);
  padding:11px 0;margin:0 0 30px
}

/* Headings */
.stf-section-head{
  display:flex;align-items:end;justify-content:space-between;gap:18px;
  margin:42px 0 16px;padding-top:4px
}
.stf-section-head h3{
  color:var(--serene-deep);font-size:25px;margin:0;letter-spacing:-.035em;font-weight:600
}
.stf-section-head p{margin:0;color:var(--serene-muted);font-size:11px}

/* Menu cards */
.stf-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.stf-card{
  border:1px solid var(--serene-line);background:rgba(255,255,255,.92);
  border-radius:10px;padding:24px 24px 21px;
  box-shadow:none;
}
.stf-card[hidden]{display:none}
.stf-card-top{display:flex;justify-content:space-between;gap:12px}
.stf-card h4{
  color:var(--serene-deep);margin:4px 0 2px;font-size:20px;letter-spacing:-.025em;font-weight:600
}
.stf-sub{
  color:var(--serene-green);font-size:11px;font-weight:650;letter-spacing:.02em
}
.stf-tags{display:flex;flex-wrap:wrap;gap:6px;margin:15px 0 17px}
.stf-tag{
  background:rgba(229,236,228,.78);border:1px solid rgba(139,169,145,.18);
  border-radius:999px;padding:5px 9px;font-size:10px;color:var(--serene-deep)
}
.stf-option{padding:15px 0;border-top:1px solid rgba(68,106,91,.12)}
.stf-option:first-of-type{border-top:0}
.stf-option-title{display:flex;justify-content:space-between;gap:13px;align-items:flex-start}
.stf-name{font-weight:650;font-size:14px;color:var(--serene-ink)}
.stf-spec{color:var(--serene-muted);font-size:11px;margin-top:3px;line-height:1.55}
.stf-prices{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.stf-price{
  border:1px solid rgba(68,106,91,.14);border-radius:6px;
  padding:8px 10px;min-width:116px;background:#fff
}
.stf-price b{display:block;font-size:14px;margin-top:1px;color:var(--serene-ink);font-weight:650}
.stf-price small{font-size:9px;color:var(--serene-muted);letter-spacing:.02em}
.stf-price.first{
  border-color:rgba(89,136,101,.38);background:rgba(229,236,228,.58)
}
.stf-price.first b{color:var(--serene-deep)}
.stf-price.first small{color:var(--serene-green);font-weight:700}
.stf-consult{
  display:inline-flex;align-items:center;justify-content:center;
  text-decoration:none;border:0;border-bottom:1px solid var(--serene-soft-green);
  color:var(--serene-deep);padding:6px 1px 4px;
  font-size:10px;font-weight:650;white-space:nowrap;
}
.stf-consult:hover{color:var(--serene-green);border-bottom-color:var(--serene-green)}
.stf-more{
  width:100%;border:1px solid rgba(68,106,91,.12);
  background:rgba(229,236,228,.50);padding:10px 12px;border-radius:6px;
  color:var(--serene-deep);cursor:pointer;margin-top:9px;font-size:11px;font-weight:650
}

/* Monthly event: beige editorial, not discount-store red */
.stf-event-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stf-event-card{
  position:relative;border:1px solid rgba(68,106,91,.14);
  background:rgba(227,218,200,.36);border-radius:8px;padding:19px 18px 18px
}
.stf-event-card:before{
  content:"";display:block;width:28px;height:2px;background:var(--serene-green);margin-bottom:13px
}
.stf-event-label{
  font-size:9px;font-weight:700;color:var(--serene-green);letter-spacing:.10em
}
.stf-event-card h5{

}
.stf-event-spec{color:var(--serene-muted);font-size:10px;min-height:42px;line-height:1.6}
.stf-event-price{

.stf-cta{

  padding:34px 36px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:24px

.stf-cta h3{font-size:22px;margin:0 0 7px;font-weight:600;letter-spacing:-.03em}
.stf-cta p{color:rgba(255,255,255,.78);margin:0;font-size:12px;line-height:1.75}
.stf-cta a{
  background:#fff;color:var(--serene-deep);text-decoration:none;border-radius:999px;
  padding:13px 20px;font-weight:650;font-size:12px
}
.stf-notice{
  margin-top:18px;background:rgba(229,236,228,.55);
  border:1px solid rgba(68,106,91,.09);border-radius:6px;
  padding:17px 20px;color:var(--serene-muted);font-size:10px

.stf-notice ul{margin:0;padding-left:17px}
.stf-notice li+li{margin-top:6px}

/* Internal preview mark */
.stf-brand-note{
  display:flex;justify-content:space-between;gap:12px;align-items:center;
  margin:18px 0 0;padding:12px 14px;border-top:1px solid var(--serene-line);
  color:var(--serene-muted);font-size:10px

.stf-brand-note strong{color:var(--serene-deep);font-weight:650}

@media(max-width:760px){
  .stf-wrap{padding:18px 14px 60px}
  .stf-hero{padding:44px 24px 38px;border-radius:3px}

  .stf-philosophy span{display:flex;padding:8px 0;margin:0;min-height:auto}
  .stf-philosophy span+span:before{display:none}
  .stf-discovery{padding:28px 2px 14px}
  .stf-grid,.stf-event-grid{grid-template-columns:1fr}
  .stf-card{padding:20px 18px;border-radius:8px}

  .stf-nav{top:0;margin-left:-14px;margin-right:-14px;padding-left:14px;padding-right:14px}

      </ul>
    </aside>
    <div class="stf-brand-note">
      <strong>SERENE BRAND PREVIEW · KR</strong>
      <span>딥 그린 · 미스트 그린 · 웜 베이지 · 상담 중심 톤 적용</span>
    </div>
  </div>`;

  function applyFilter(cat, reason='category'){
    active = cat;
    ROOT.querySelectorAll('.stf-filter').forEach(b=>b.classList.toggle('is-active',b.dataset.filter===cat));
    ROOT.querySelectorAll('.stf-card,.stf-event-card').forEach(el=>{
      el.hidden = !(cat==='all' || el.dataset.cat===cat);
    });
    track(reason==='concern'?'menu_concern_click':'menu_category_click',{category:cat});
  }

  ROOT.addEventListener('click', e=>{
    const filter = e.target.closest('[data-filter]');
    if(filter) applyFilter(filter.dataset.filter);

    const concern = e.target.closest('[data-concern]');
    if(concern){
      const cat = concernMap[concern.dataset.concern] || 'all';
      applyFilter(cat,'concern');
      ROOT.querySelector('.stf-nav').scrollIntoView({behavior:'smooth',block:'start'});
    }

    const more = e.target.closest('.stf-more');
    if(more){
      const rest = more.previousElementSibling;
      const open = rest.hasAttribute('hidden');
      if(open){rest.removeAttribute('hidden');more.textContent='닫기';}
      else{rest.setAttribute('hidden','');more.textContent='전체 메뉴 보기';}
      track('menu_expand',{category:more.closest('.stf-card')?.dataset.cat||''});
    }

    const line = e.target.closest('[data-action="line"]');
    if(line){
      track('menu_line_click',{
        menu_code:line.dataset.menu||'',
        event_code:line.dataset.event||'',
        category:line.closest('[data-cat]')?.dataset.cat||'general'
      });
    }
  });

  track('menu_funnel_view',{page_path:location.pathname});
})();
</script>
